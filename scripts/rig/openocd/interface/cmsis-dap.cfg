#
# The stock interface/cmsis-dap.cfg plus the probe of one rig board.
#
# scripts/rig/boards.py points OPENOCD_SCRIPTS here, and OpenOCD searches that
# directory before its own scripts, so every `-f interface/cmsis-dap.cfg` and
# `source [find interface/cmsis-dap.cfg]` in the tree (flash_rp2350.cfg,
# reset_target.sh, hw_flash.sh, the remote runner's scripts) talks to the probe
# of the board the job holds, YASOS_PROBE_SERIAL, instead of the first CMSIS-DAP
# probe on the bus.  Without the variable it is the stock file.

adapter driver cmsis-dap

if {[info exists ::env(YASOS_PROBE_SERIAL)] && $::env(YASOS_PROBE_SERIAL) ne ""} {
    adapter serial $::env(YASOS_PROBE_SERIAL)
}
