name: Yasos Releasing Workflow

on:
  push:
    tags: ['v*']
  # A dry run from any branch: builds and uploads the release files, creates no
  # release (`gh workflow run yasos_release.yml --ref <branch>`).
  workflow_dispatch:

jobs:
  # One rootfs.img for every RP2350 board: their kernels do not embed it (it is
  # flashed on its own at 0x10120000), and build_rootfs.sh reads only the CPU
  # and the userspace FP settings, which the boards share. build_image.sh builds
  # it once, then a kernel and a package per board, and stops if a board would
  # need a different rootfs. (v0.9.0's two separately built images differed only
  # in ctags' __TIME__ string.)
  build_images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/matgla/yasos.zig:v0.21
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Install GNU make bootstrap tools
        shell: bash
        run: |
          command -v autopoint >/dev/null && command -v makeinfo >/dev/null ||
            { apt-get update -y && apt-get install -y autoconf automake autopoint gettext texinfo; }
      # Releases carry the device Zig compiler (/usr/bin/zig; its lib in the
      # package's sdcard/, for /var/lib/zig on the card), built from the fork
      # pinned in apps/zig/zig_fork.txt -- the same build as the smoke
      # workflow's build_hw_zig.
      - name: Fetch the pinned Zig fork
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./apps/zig/fetch_fork.sh .cache/zig-fork
      - name: Build rootfs once, then a kernel and a package per board
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          YASOS_IMAGE_ZIG="$PWD/.cache/zig-fork" ./build_image.sh pimoroni_pico_plus2_and_vga_defconfig mspc_defconfig
          cp rootfs.img "output/rootfs_$(git describe --tags --always).img"
          ls -l output/*.tar.gz output/*.img
      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release_files
          if-no-files-found: error
          path: |
            output/*.tar.gz
            output/rootfs_*.img

  # The release is created only once every package built, so a failed build no
  # longer leaves a published release with some of its assets missing.
  release:
    needs: build_images
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: release_files
          path: dist
      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n 1 || true)
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log "${PREVIOUS_TAG}..${TAG}" --pretty=format:"- %s (%h)" --no-merges)
          fi
          {
            echo "## Changes"
            echo ""
            echo "${CHANGELOG:-- No changes}"
            echo ""
            echo "## Files"
            echo ""
            echo "- \`<board>_${TAG}.tar.gz\`: that board's kernel, rootfs.img, flash configs and decode bundle."
            echo "- \`rootfs_${TAG}.img\`: the root filesystem, the same for every RP2350 board (flash offset 0x120000)."
          } > notes.md
          cat notes.md
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Release $GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/*
