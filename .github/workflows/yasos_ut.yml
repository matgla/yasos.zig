name: Yasos Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  execute_system_tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/matgla/yasos.zig:v0.16
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - name: Execute tests
        shell: bash
        run: |
          set -euo pipefail

          attempts=3
          delay=15

          for attempt in $(seq 1 "$attempts"); do
            if zig build test --summary all; then
              exit 0
            fi

            if [ "$attempt" -eq "$attempts" ]; then
              echo "zig build test failed after $attempts attempts"
              exit 1
            fi

            echo "zig build test failed on attempt $attempt/$attempts; retrying in ${delay}s"
            sleep "$delay"
          done
