name: Yasos Smoke Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Run the full smoke suite under QEMU in the cloud (no hardware). Builds the
  # mps3-an524 kernel and runs every suite at -O0/-O1/-O2 incl. gcc-torture
  # (run_qemu_smoke.sh defaults).
  #
  # This used to gate build_hw, so a run cost qemu (~20 min) + build + hardware
  # (~45 min) in series. It no longer does: the hardware chain starts at the
  # same time, so the run is now max(qemu, build + hardware) -- roughly the
  # hardware leg alone. The cost of dropping the gate is that a QEMU-visible
  # break still burns a board run; the board is a single self-hosted runner, so
  # that is board time, not cloud money.
  qemu_gate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/matgla/yasos.zig:v0.20
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      # build_rootfs.sh bootstraps apps/make, which needs these. The Dockerfile
      # installs them too; this step is a no-op once the image is bumped past v0.19.
      - name: Install GNU make bootstrap tools
        shell: bash
        run: |
          command -v autopoint >/dev/null && command -v makeinfo >/dev/null ||
            { apt-get update -y && apt-get install -y autoconf automake autopoint gettext texinfo; }
      # The -O levels and the kernel optimize mode are spelled out here rather
      # than left to the script defaults: dropping a level, or dropping the
      # safety checks, is a coverage cut, and it should be a reviewable line in
      # the diff, not a default someone changed elsewhere.
      #
      # --safe keeps Zig's safety checks (bounds, overflow, null-unwrap) on. It
      # is what catches the class of bug ReleaseFast lets through silently -- an
      # interface double-release corrupted newlib's kernel free list at boot and
      # only ReleaseSafe's heap layout turned it into a visible fault.
      - name: Run QEMU smoke gate (ReleaseSafe, -O0/-O1/-O2, incl. gcc-torture)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p tests/smoke/logs
          ./scripts/run_qemu_smoke.sh --safe --opt-levels '-O0 -O1 -O2'
      # A 64-bit atomic on an M33 does not fail to build, it becomes a lock-taking
      # __atomic_* libcall -- so the only place that failure is visible is the
      # linked binary. Cheap, and it also proves the atomics we do have lowered
      # to real exclusives rather than being folded away.
      # phase 3's completion test: `block_context_switch` is not a lock and must
      # not come back. See docs/smp_plan.md.
      - name: No block_context_switch call sites
        if: always()
        shell: bash
        run: ./scripts/verify_no_block_context_switch.sh
      - name: Atomics lowering gate
        if: always()
        shell: bash
        run: ./scripts/verify_atomics.sh zig-out/bin/yasos_kernel
      # Guards against silent .text drift: the device tcc grew 2.17 -> 2.42 MiB
      # over six weeks with nothing noticing. The budget is a literal here on
      # purpose -- raising it has to show up as a reviewable line in the diff.
      # Ratchet it down whenever the warning below fires.
      - name: tcc .text size gate
        if: always()
        shell: bash
        run: |
          BUDGET=1800000
          ELF=libs/tinycc/bin/armv8m-tcc.elf
          # Also covers the known "build_rootfs.sh exits 0 when make failed" trap:
          # without this, a missing ELF would silently skip the gate.
          if [ ! -f "$ELF" ]; then
            echo "::error::$ELF missing - did the rootfs build fail?"
            exit 1
          fi
          TEXT=$(arm-none-eabi-size -A "$ELF" | awk '$1==".text"{print $2}')
          if [ -z "$TEXT" ]; then
            echo "::error::could not read .text from $ELF"
            exit 1
          fi
          echo "tcc .text = $TEXT B / budget $BUDGET B (headroom $((BUDGET-TEXT)) B)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$TEXT" -gt "$BUDGET" ]; then
            echo "::error::tcc .text grew past budget: $TEXT > $BUDGET"
            exit 1
          fi
          if [ "$TEXT" -lt $((BUDGET - 100000)) ]; then
            echo "::warning::.text is $((BUDGET-TEXT)) B under budget - ratchet BUDGET down in .github/workflows/yasos_smoke.yml"
          fi

      - name: Collect decode bundle (firmware + rootfs + symbol ELFs)
        if: failure()
        shell: bash
        run: ./scripts/collect_decode_bundle.sh decode_bundle
      - name: Upload QEMU gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu_gate_logs
          path: |
            .cache/qemu_smoke_logs/**
            tests/smoke/logs/**
            decode_bundle/**

  # Build the hardware image once in the cloud and publish it as an artifact so
  # the board runner never recompiles. Package = kernel + rootfs.img + flash
  # cfgs + run_hw_smoke.sh (build_image.sh).
  #
  # Deliberately has no `needs:` -- it starts alongside qemu_gate so the board
  # can begin its ~45 min run instead of waiting out the ~20 min QEMU suite
  # first. Different runner, different board (RP2350 vs mps3-an524), so the two
  # builds do not share a workspace or a cache.
  build_hw:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/matgla/yasos.zig:v0.20
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - name: Install GNU make bootstrap tools
        shell: bash
        run: |
          command -v autopoint >/dev/null && command -v makeinfo >/dev/null ||
            { apt-get update -y && apt-get install -y autoconf automake autopoint gettext texinfo; }
      # ReleaseSafe for the same reason as the QEMU gate, and stated explicitly
      # so the two legs are visibly building the same kernel configuration.
      - name: Build hardware smoke package (ReleaseSafe kernel + rootfs + run script)
        shell: bash
        env:
          YASOS_KERNEL_OPTIMIZE: ReleaseSafe
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./build_image.sh pimoroni_pico_plus2_and_vga_defconfig
      - name: Upload hardware smoke package
        uses: actions/upload-artifact@v4
        with:
          name: hw_smoke_package
          path: output/*.tar.gz
      # hardware_selfhost's payload, from the same checkout as the image: the board's
      # rootfs tcc compiles these tinycc sources, and its objects must equal the ones
      # the cross made here from the same command lines.
      - name: Prepare tcc self-host payload
        shell: bash
        run: python3 scripts/tcc_selfhost.py --prepare-only
      - name: Upload tcc self-host payload
        uses: actions/upload-artifact@v4
        with:
          name: selfhost_payload
          path: .cache/tcc_selfhost/payload

  # The board image with the device Zig compiler in its rootfs (the pinned fork,
  # apps/zig/zig_fork.txt), and the kernel as the board will build it: the tree of
  # sources, the zig lib, and the hash of every output the host reference makes --
  # the fork's single-threaded host compiler and the cross running the same
  # build_all.sh (scripts/kernel_tcc/zig_device.py).
  build_hw_zig:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/matgla/yasos.zig:v0.20
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - name: Install GNU make bootstrap tools
        shell: bash
        run: |
          command -v autopoint >/dev/null && command -v makeinfo >/dev/null ||
            { apt-get update -y && apt-get install -y autoconf automake autopoint gettext texinfo; }
      - name: Fetch the pinned Zig fork
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./apps/zig/fetch_fork.sh .cache/zig-fork
      - name: Build hardware image with the device zig (ReleaseSafe kernel + rootfs)
        shell: bash
        env:
          YASOS_KERNEL_OPTIMIZE: ReleaseSafe
        run: |
          YASOS_IMAGE_ZIG="$PWD/.cache/zig-fork" ./build_image.sh pimoroni_pico_plus2_and_vga_defconfig
      - name: Kernel tree and host references for the board
        shell: bash
        run: |
          python3 scripts/kernel_tcc/zig_device.py prepare
          python3 scripts/kernel_tcc/zig_device.py full --package zig_kernel_package
      - name: Upload hardware zig package
        uses: actions/upload-artifact@v4
        with:
          name: hw_zig_package
          path: output/*.tar.gz
      - name: Upload zig kernel package
        uses: actions/upload-artifact@v4
        with:
          name: zig_kernel_package
          path: zig_kernel_package

  # Flash the prebuilt package onto the real RP2350 and run the on-device suite
  # at -O0/-O1/-O2 incl. gcc-torture. No host build happens here — the kernel +
  # rootfs come straight from the build_hw artifact.
  #
  # Runs concurrently with qemu_gate (it needs only the build), so a red QEMU
  # suite no longer stops this from starting; check both jobs' results, not
  # just the one that finished first.
  hardware_smoke:
    needs: build_hw
    runs-on: [self-hosted, pimoroni_pico_plus2]
    steps:
      - name: Cleanup workspace
        run: |
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - name: Download hardware smoke package
        uses: actions/download-artifact@v4
        with:
          name: hw_smoke_package
          path: artifact
      - name: Stage prebuilt kernel + rootfs (no rebuild on the board)
        run: ./scripts/stage_hw_package.sh artifact
      # Same reasoning as the QEMU gate: the levels are explicit. Comma-separated
      # because make hands the command to run_container.sh, which expands it
      # unquoted -- a space-separated value would word-split before it reached
      # run_hw_smoke.sh.
      #
      # The Pi hosting this runner also hosts matgla/tinycc's metrics runner, and
      # that job flashes the SAME RP2350 over the SAME CMSIS-DAP probe. GitHub's
      # `concurrency:` groups are repo-scoped, so neither repo can serialize
      # against the other -- on 2026-08-24 a tinycc perf run landed inside this
      # job's window and all six of its arms came back with no usable data. Both
      # repos take this host lock around every board-touching step; fd 9 stays
      # open for the rest of the step, so the lock covers the container run and is
      # released when the step's shell exits. -w bounds the wait so a stale holder
      # fails the job with a clear reason instead of hanging until the job timeout.
      - name: Run hardware smoke (-O0/-O1/-O2, incl. gcc-torture, no rebuild)
        run: |
          exec 9>/var/lock/rp2350-board.lock
          flock -w 7200 9 || {
            echo "::error::RP2350 board lock still held after 2h --" \
                 "another run (likely matgla/tinycc metrics on this Pi) owns the probe"
            exit 1
          }
          make run_smoke_tests_packaged SMOKE_OPT_LEVELS=-O0,-O1,-O2
      - name: Stage decode bundle if failed (firmware + rootfs + symbol ELFs)
        if: failure()
        run: |
          dest="${{ github.workspace }}/tests/smoke/logs/decode_bundle"
          mkdir -p "$dest/symbols"
          cp "${{ github.workspace }}/zig-out/bin/yasos_kernel" "$dest/symbols/" || true
          cp "${{ github.workspace }}/rootfs.img" "$dest/" || true
          # Symbol ELFs travel in the prebuilt package's decode_bundle/.
          bundle=$(find artifact -type d -name decode_bundle | head -n1)
          if [ -n "$bundle" ]; then cp -r "$bundle"/. "$dest/"; fi
      - name: Upload Test Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke_test_logs
          path: ${{ github.workspace }}/tests/smoke/logs/*

  # The board compiles its own compiler: the rootfs tcc builds tinycc (object for
  # object equal to the host cross's), and the tcc it built rebuilds itself to a
  # byte-identical fixpoint (scripts/tcc_selfhost.py, stage 3).  Same package as
  # hardware_smoke; the single board runner runs the two one after the other.
  hardware_selfhost:
    needs: build_hw
    runs-on: [self-hosted, pimoroni_pico_plus2]
    steps:
      - name: Cleanup workspace
        run: |
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - name: Download hardware smoke package
        uses: actions/download-artifact@v4
        with:
          name: hw_smoke_package
          path: artifact
      - name: Download tcc self-host payload
        uses: actions/download-artifact@v4
        with:
          name: selfhost_payload
          path: selfhost_payload
      - name: Stage prebuilt kernel + rootfs (no rebuild on the board)
        run: ./scripts/stage_hw_package.sh artifact
      # The board lock, as in hardware_smoke: matgla/tinycc's metrics runner shares
      # the probe.
      - name: tcc self-host on the board (stage 2 + fixpoint)
        run: |
          exec 9>/var/lock/rp2350-board.lock
          flock -w 7200 9 || {
            echo "::error::RP2350 board lock still held after 2h --" \
                 "another run (likely matgla/tinycc metrics on this Pi) owns the probe"
            exit 1
          }
          make run_selfhost_packaged SELFHOST_PAYLOAD=selfhost_payload
      - name: Upload self-host logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost_logs
          path: ${{ github.workspace }}/.cache/tcc_selfhost/run_*.log

  # The kernel built on the board: the device zig renders it to C, tcc compiles it
  # and links it, and every output -- the kernel ELF included -- must equal the host
  # reference's (scripts/kernel_tcc/zig_device.py board-run).
  hardware_zig_kernel:
    needs: build_hw_zig
    runs-on: [self-hosted, pimoroni_pico_plus2]
    steps:
      - name: Cleanup workspace
        run: |
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v3
      - name: Download hardware zig package
        uses: actions/download-artifact@v4
        with:
          name: hw_zig_package
          path: artifact
      - name: Download zig kernel package
        uses: actions/download-artifact@v4
        with:
          name: zig_kernel_package
          path: zig_kernel_package
      - name: Stage prebuilt kernel + rootfs (no rebuild on the board)
        run: ./scripts/stage_hw_package.sh artifact
      - name: Kernel built on the board (zig render, zigfix, tcc, link)
        run: |
          exec 9>/var/lock/rp2350-board.lock
          flock -w 7200 9 || {
            echo "::error::RP2350 board lock still held after 2h --" \
                 "another run (likely matgla/tinycc metrics on this Pi) owns the probe"
            exit 1
          }
          make run_zig_kernel_packaged ZIG_KERNEL_PACKAGE=zig_kernel_package
      - name: Upload board build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zig_kernel_logs
          path: ${{ github.workspace }}/.cache/zig_device/board_run.log
