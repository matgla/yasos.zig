name: Yasos Smoke Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Gate: run the full smoke suite under QEMU in the cloud (no hardware) before
  # the physical board is touched. Builds the mps2-an505 kernel and runs every
  # suite at -O0/-O1/-O2 incl. gcc-torture (run_qemu_smoke.sh defaults). A
  # failure here blocks build_hw + hardware_smoke.
  qemu_gate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/matgla/yasos.zig:v0.18
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - name: Run QEMU smoke gate (-O0/-O1/-O2, incl. gcc-torture)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p tests/smoke/logs
          ./scripts/run_qemu_smoke.sh
      - name: Collect decode bundle (firmware + rootfs + symbol ELFs)
        if: failure()
        shell: bash
        run: ./scripts/collect_decode_bundle.sh decode_bundle
      - name: Upload QEMU gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu_gate_logs
          path: |
            .cache/qemu_smoke_logs/**
            tests/smoke/logs/**
            decode_bundle/**

  # Build the hardware image once in the cloud and publish it as an artifact so
  # the board runner never recompiles. Package = kernel + rootfs.img + flash
  # cfgs + run_hw_smoke.sh (build_image.sh).
  build_hw:
    needs: qemu_gate
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/matgla/yasos.zig:v0.18
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - name: Build hardware smoke package (kernel + rootfs + run script)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./build_image.sh pimoroni_pico_plus2_and_vga_defconfig
      - name: Upload hardware smoke package
        uses: actions/upload-artifact@v4
        with:
          name: hw_smoke_package
          path: output/*.tar.gz

  # Flash the prebuilt package onto the real RP2350 and run the on-device suite
  # at -O0/-O1/-O2 incl. gcc-torture. No host build happens here — the kernel +
  # rootfs come straight from the build_hw artifact.
  hardware_smoke:
    needs: build_hw
    runs-on: [self-hosted, pimoroni_pico_plus2]
    steps:
      - name: Cleanup workspace
        run: |
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - name: Download hardware smoke package
        uses: actions/download-artifact@v4
        with:
          name: hw_smoke_package
          path: artifact
      - name: Stage prebuilt kernel + rootfs (no rebuild on the board)
        run: |
          pkg=$(find artifact -name '*.tar.gz' | head -n1)
          if [ -z "$pkg" ]; then echo "no package tarball found in artifact/" >&2; exit 1; fi
          tar -xzf "$pkg" -C artifact
          # Exclude the decode_bundle/ copies so we pick the package top-level
          # kernel + rootfs (the bundle holds symbol ELFs for decoding only).
          kernel=$(find artifact -name yasos_kernel -not -path '*/decode_bundle/*' | head -n1)
          rootfs=$(find artifact -name rootfs.img -not -path '*/decode_bundle/*' | head -n1)
          if [ -z "$kernel" ] || [ -z "$rootfs" ]; then
            echo "package missing yasos_kernel or rootfs.img" >&2; exit 1
          fi
          mkdir -p zig-out/bin
          cp "$kernel" zig-out/bin/yasos_kernel
          cp "$rootfs" rootfs.img
      - name: Run hardware smoke (-O0/-O1/-O2, incl. gcc-torture, no rebuild)
        run: make run_smoke_tests_packaged
      - name: Stage decode bundle if failed (firmware + rootfs + symbol ELFs)
        if: failure()
        run: |
          dest="${{ github.workspace }}/tests/smoke/logs/decode_bundle"
          mkdir -p "$dest/symbols"
          cp "${{ github.workspace }}/zig-out/bin/yasos_kernel" "$dest/symbols/" || true
          cp "${{ github.workspace }}/rootfs.img" "$dest/" || true
          # Symbol ELFs travel in the prebuilt package's decode_bundle/.
          bundle=$(find artifact -type d -name decode_bundle | head -n1)
          if [ -n "$bundle" ]; then cp -r "$bundle"/. "$dest/"; fi
      - name: Upload Test Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke_test_logs
          path: ${{ github.workspace }}/tests/smoke/logs/*
