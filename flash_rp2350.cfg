source [find interface/cmsis-dap.cfg]
adapter driver picoprobe

adapter speed 5000
source [find target/rp2350.cfg]

# The rootfs in partition 1 ("yasos"), 1 MiB in: flash offset 0x120000.  The
# kernel ELF carries the partition table (offset 0) and loads at 0x20000.
program rootfs.img 0x10120000
program zig-out/bin/yasos_kernel verify reset exit